name: Release

# Push a tag like v0.2.0 to build binaries and publish a GitHub Release.
# Release notes: docs/releases/<tag>.md if it exists, else the tag message.
# (Prefer the file: git strips lines starting with "#" from tag messages, so
# Markdown headings are lost unless the tag is created with --cleanup=verbatim.)
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: test
        run: go test -race -count=1 ./...

      - name: build binaries
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64; do
            os=${target%/*}; arch=${target#*/}
            name="lawliet_${os}_${arch}"
            bin="lawliet"; [ "$os" = windows ] && bin="lawliet.exe"
            mkdir -p "build/$name"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X github.com/tranbaohieu/lawliet/internal/version.Version=${TAG}" \
              -o "build/$name/$bin" ./cmd/lawliet
            cp LICENSE README.md "build/$name/"
            if [ "$os" = windows ]; then
              (cd build && zip -qr "../dist/$name.zip" "$name")
            else
              tar -C build -czf "dist/$name.tar.gz" "$name"
            fi
          done
          ls -l dist

      - name: smoke test linux/amd64 binary
        run: |
          tar -xzf dist/lawliet_linux_amd64.tar.gz -C /tmp
          /tmp/lawliet_linux_amd64/lawliet --version | tee /dev/stderr | grep -q "${GITHUB_REF_NAME}"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # One wheel per target with the binary built above (python/hatch_build.py).
      - name: build Python wheels
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          echo "__version__ = \"${TAG#v}\"" > python/src/lawliet/_version.py
          python -m pip install build
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64; do
            os=${target%/*}; arch=${target#*/}
            bin="lawliet"; [ "$os" = windows ] && bin="lawliet.exe"
            LAWLIET_TARGET=$target LAWLIET_BINARY="build/lawliet_${os}_${arch}/$bin" \
              python -m build --wheel --outdir dist-python python
          done
          ls -l dist-python

      - name: smoke test linux/amd64 wheel
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist-python/*manylinux*_x86_64*.whl
          /tmp/venv/bin/lawliet --version | tee /dev/stderr | grep -q "${GITHUB_REF_NAME}"
          /tmp/venv/bin/python -c "import lawliet; r = lawliet.start(); assert r.ping(); lawliet.stop()"

      - uses: actions/upload-artifact@v4
        with:
          name: python-wheels
          path: dist-python/*.whl

      - name: checksums
        run: |
          cp dist-python/*.whl dist/
          (cd dist && sha256sum * > checksums.txt)
          cat dist/checksums.txt

      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -f "docs/releases/${TAG}.md" ]; then
            cp "docs/releases/${TAG}.md" notes.md
          else
            git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
            git tag -l --format='%(contents)' "$TAG" > notes.md
          fi
          gh release create "$TAG" dist/* --title "Lawliet $TAG" --notes-file notes.md --verify-tag

  # Publishes the wheels to PyPI with trusted publishing (no token stored in GitHub).
  # Off until the repository variable PYPI_PUBLISH is "true"; first configure a trusted
  # publisher on pypi.org for this repository, workflow release.yml, environment "pypi".
  pypi:
    needs: release
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-wheels
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
