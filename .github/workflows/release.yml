name: Release

# Push an annotated tag like v0.2.0 to build binaries and publish a GitHub Release.
# The tag message becomes the release notes.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: test
        run: go test -race -count=1 ./...

      - name: build binaries
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64; do
            os=${target%/*}; arch=${target#*/}
            name="lawliet_${os}_${arch}"
            bin="lawliet"; [ "$os" = windows ] && bin="lawliet.exe"
            mkdir -p "build/$name"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X github.com/tranbaohieu/lawliet/internal/version.Version=${TAG}" \
              -o "build/$name/$bin" ./cmd/lawliet
            cp LICENSE README.md "build/$name/"
            if [ "$os" = windows ]; then
              (cd build && zip -qr "../dist/$name.zip" "$name")
            else
              tar -C build -czf "dist/$name.tar.gz" "$name"
            fi
          done
          (cd dist && sha256sum * > checksums.txt)
          ls -l dist

      - name: smoke test linux/amd64 binary
        run: |
          tar -xzf dist/lawliet_linux_amd64.tar.gz -C /tmp
          /tmp/lawliet_linux_amd64/lawliet --version | tee /dev/stderr | grep -q "${GITHUB_REF_NAME}"

      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          git tag -l --format='%(contents)' "$TAG" > notes.md
          gh release create "$TAG" dist/* --title "Lawliet $TAG" --notes-file notes.md --verify-tag
